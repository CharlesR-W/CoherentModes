<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="D1-title D1-desc">
<title id="D1-title">D1 Sites and views</title>
<desc id="D1-desc">A site x is one place where the network has an activation; the same x at layers 0, 1, 2 is the same site [A1]. Each view φ(x) is normalized onto a sphere and compared by a dot product [A2]; the output view is √p, not the simplex.</desc>
