85.8" fill="#52514e"/><text x="600.0" y="420.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#0b0b0b" text-anchor="middle"><tspan>‖P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6"> c‖ = 0.99 → ‖P</tspan><tspan font-size="13.0" dy="-7.6">L′</tspan><tspan dy="7.6">P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6"> c‖ = 0.03</tspan></text><text x="600.0" y="448.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>slow at L, nearly annihilated at L′:</tspan></text><text x="600.0" y="472.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>a merge (read off Q)</tspan></text><text x="600.0" y="512.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#0b0b0b" text-anchor="middle"><tspan>top centred σ</tspan><tspan font-size="13.0" dy="5.4">1</tspan><tspan dy="-5.4"> = 0.03</tspan></text><text x="980.0" y="176.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="22" fill="#0b0b0b" text-anchor="middle" font-weight="700"><tspan>split</tspan></text><circle cx="888.0" cy="290.0" r="76.0" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1.5"/><ellipse cx="888.0" cy="290.0" rx="76.0" ry="21.3" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 4"/><text x="888.0" y="394.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>layer L</tspan></text><circle cx="889.6" cy="273.3" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="882.5" cy="247.4" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="889.0" cy="258.0" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="896.4" cy="264.0" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="883.9" cy="260.9" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="883.1" cy="250.6" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="889.5" cy="268.5" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="884.7" cy="249.3" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="884.2" cy="248.3" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="886.8" cy="256.9" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="887.4" cy="272.4" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="887.6" cy="271.0" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><text x="887.3" y="247.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#0b0b0b" text-anchor="middle"><tspan>A, B</tspan></text><circle cx="1072.0" cy="290.0" r="76.0" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1.5"/><ellipse cx="1072.0" cy="290.0" rx="76.0" ry="21.3" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 4"/><text x="1072.0" y="394.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>layer L′</tspan></text><circle cx="1015.2" cy="259.0" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="1124.1" cy="259.0" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="1021.1" cy="262.1" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="1119.5" cy="264.4" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="1015.0" cy="261.7" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="1124.2" cy="250.4" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="1017.8" cy="256.0" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="1128.6" cy="259.0" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="1016.5" cy="259.8" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="1123.8" cy="258.7" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="1016.6" cy="258.2" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="1122.9" cy="255.8" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><text x="1017.1" y="245.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#0b0b0b" text-anchor="middle"><tspan>A</tspan></text><text x="1123.8" y="243.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#0b0b0b" text-anchor="middle"><tspan>B</tspan></text><line x1="970.0" y1="290.0" x2="982.8" y2="290.0" stroke="#52514e" stroke-width="1.60" stroke-linecap="round"/><polygon points="990.0,290.0 982.1,294.2 982.1,285.8" fill="#52514e"/><text x="980.0" y="420.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#0b0b0b" text-anchor="middle"><tspan>‖P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6"> c‖ = 0.03, ‖P</tspan><tspan font-size="13.0" dy="-7.6">L′</tspan><tspan dy="7.6"> c‖ = 0.99</tspan></text><text x="980.0" y="448.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>not slow at L, slow at L′:</tspan></text><text x="980.0" y="472.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>a split (read off Q</tspan><tspan font-size="11.5" dy="-6.7">T</tspan><tspan dy="6.7">)</tspan></text><text x="980.0" y="512.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#0b0b0b" text-anchor="middle"><tspan>top centred σ</tspan><tspan font-size="13.0" dy="5.4">1</tspan><tspan dy="-5.4"> = 0.03</tspan></text><line x1="40.0" y1="552.0" x2="1160.0" y2="552.0" stroke="#e1e0d9" stroke-width="1.00" stroke-linecap="round"/><text x="40.0" y="584.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#52514e" text-anchor="start"><tspan>merge and split have the same σ</tspan><tspan font-size="13.0" dy="5.4">1</tspan><tspan dy="-5.4"> (Q and Q</tspan><tspan font-size="13.0" dy="-7.6">T</tspan><tspan dy="7.6"> share singular values): σ alone gives no direction;</tspan></text><text x="40.0" y="610.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#52514e" text-anchor="start"><tspan>the direction comes from comparing ‖P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6"> c‖ with ‖P</tspan><tspan font-size="13.0" dy="-7.6">L′</tspan><tspan dy="7.6"> c‖. When L = L′, σ</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan dy="-5.4"> = λ</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan font-size="13.0" dy="-13.0">2</tspan><tspan dy="7.6">, so a small σ is never by</tspan></text><text x="40.0" y="636.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#52514e" text-anchor="start"><tspan>itself evidence of a new distinction. Reading a merge or split off a singular pair is [hyp], checked on extracted sets.</tspan></text>
<line x1="32.0" y1="684.0" x2="1168.0" y2="684.0" stroke="#e1e0d9" stroke-width="1.00" stroke-linecap="round"/>
<text x="32.0" y="710.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#52514e" text-anchor="start"><tspan>The same sites at two layers [A1] give Q</tspan><tspan font-size="13.0" dy="-7.6">L→L′</tspan><tspan dy="7.6"> = P</tspan><tspan font-size="13.0" dy="-7.6">L′</tspan><tspan dy="7.6">P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6">. A contrast slow at L but nearly annihilated at L′: a merge;</tspan></text>
