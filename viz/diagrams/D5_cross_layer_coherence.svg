<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="772" viewBox="0 0 1200 772" role="img" aria-labelledby="D5-title D5-desc">
<title id="D5-title">D5 Cross-layer coherence: coherent, merge, split</title>
<desc id="D5-desc">The same sites at two layers [A1] give Q^{L→L′} = P^{L′}P^L. A contrast slow at L but nearly annihilated at L′: a merge; one slow only at L′ is a split, read off Q^T = P^L P^{L′}. Constructed toy, β = 5; the groups A, B are for display only.</desc>
<rect x="0.0" y="0.0" width="1200.0" height="772.0" rx="0" fill="#fcfcfb"/>
<text x="32.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700"><tspan>D5</tspan></text>
<text x="78.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="600"><tspan>Cross-layer coherence: coherent, merge, split</tspan></text>
<text x="1168.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#898781" text-anchor="end"><tspan>THEORY §4.1</tspan></text>
<text x="600.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700"><tspan>Q</tspan><tspan font-size="13.0" dy="-7.6">L→L′</tspan><tspan dy="7.6"> = P</tspan><tspan font-size="13.0" dy="-7.6">L′</tspan><tspan dy="7.6"> P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6"> = Σ</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan dy="-5.4"> σ</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan dy="-5.4"> u</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan dy="-5.4"> v</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan font-size="13.0" dy="-13.0">T</tspan><tspan dy="7.6">;  v</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan dy="-5.4"> is a pattern on the sites at L, u</tspan><tspan font-size="13.0" dy="5.4">i</tspan><tspan dy="-5.4"> at L′</tspan></text><text x="600.0" y="124.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#52514e" text-anchor="middle"><tspan>same 12 sites at both layers [A1]; contrast c = (1</tspan><tspan font-size="13.0" dy="5.4">A</tspan><tspan dy="-5.4"> − 1</tspan><tspan font-size="13.0" dy="5.4">B</tspan><tspan dy="-5.4">) / √12, ‖c‖ = 1; slow: ‖P c‖ ≈ ‖c‖ (survives diffusion)</tspan></text><text x="220.0" y="176.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="22" fill="#0b0b0b" text-anchor="middle" font-weight="700"><tspan>coherent</tspan></text><circle cx="128.0" cy="290.0" r="76.0" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1.5"/><ellipse cx="128.0" cy="290.0" rx="76.0" ry="21.3" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 4"/><text x="128.0" y="394.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>layer L</tspan></text><circle cx="71.2" cy="259.0" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="180.1" cy="259.0" r="5.5" fill="#e