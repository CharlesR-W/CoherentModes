1.5"/><circle cx="255.4" cy="314.3" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="365.0" cy="322.6" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="253.1" cy="307.9" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="367.6" cy="318.9" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="246.3" cy="315.9" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="365.7" cy="322.8" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="257.0" cy="316.7" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="372.9" cy="317.2" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><text x="256.2" y="301.2" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#0b0b0b" text-anchor="middle"><tspan>A</tspan></text><text x="368.5" y="304.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#0b0b0b" text-anchor="middle"><tspan>B</tspan></text><line x1="210.0" y1="290.0" x2="222.8" y2="290.0" stroke="#52514e" stroke-width="1.60" stroke-linecap="round"/><polygon points="230.0,290.0 222.1,294.2 222.1,285.8" fill="#52514e"/><text x="220.0" y="420.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#0b0b0b" text-anchor="middle"><tspan>‖P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6"> c‖ = 0.99, ‖P</tspan><tspan font-size="13.0" dy="-7.6">L′</tspan><tspan dy="7.6">P</tspan><tspan font-size="13.0" dy="-7.6">L</tspan><tspan dy="7.6"> c‖ = 0.97</tspan></text><text x="220.0" y="448.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>c is slow at both layers:</tspan></text><text x="220.0" y="472.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>a set kept together</tspan></text><text x="220.0" y="512.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#0b0b0b" text-anchor="middle"><tspan>top centred σ</tspan><tspan font-size="13.0" dy="5.4">1</tspan><tspan dy="-5.4"> = 0.97</tspan></text><text x="600.0" y="176.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="22" fill="#0b0b0b" text-anchor="middle" font-weight="700"><tspan>merge</tspan></text><circle cx="508.0" cy="290.0" r="76.0" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1.5"/><ellipse cx="508.0" cy="290.0" rx="76.0" ry="21.3" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 4"/><text x="508.0" y="394.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#52514e" text-anchor="middle"><tspan>layer L</tspan></text><circle cx="451.2" cy="259.0" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="560.1" cy="259.0" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="457.1" cy="262.1" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="555.5" cy="264.4" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="451.0" cy="261.7" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="560.2" cy="250.4" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="453.8" cy="256.0" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="564.6" cy="259.0" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="452.5" cy="259.8" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="559.8" cy="258.7" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><circle cx="452.6" cy="258.2" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><circle cx="558.9" cy="255.8" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/><text x="453.1" y="245.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#0b